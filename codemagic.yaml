# Codemagic cloud build config — builds BOTH platforms without any local Apple hardware.
# This file MUST live at the repository root (Codemagic only reads it from there),
# so every script starts with `cd mobile` where package.json / the Android project live.
# Docs: https://docs.codemagic.io/yaml/yaml-getting-started/
# iOS:   cloud macOS machine runs `cap add ios` + builds/signs (needs Apple signing
#        credentials configured in Codemagic UI before the first release build).
# Android: cloud machine or local Windows (see mobile/README) can both build the APK/AAB.

workflows:
  android-debug:
    name: Chengyu Clash — Android (debug)
    instance_type: linux
    max_build_duration: 60
    environment:
      node: latest
    scripts:
      - name: Install dependencies and sync web
        script: |
          cd mobile
          npm ci
          npm run sync
          npx cap sync android
      - name: Build debug APK
        script: |
          cd mobile
          ./android/gradlew -p android assembleDebug
    publishing:
      email:
        recipients:
          - YOUR_EMAIL@example.com
      # 注意：Codemagic publishing 不允许顶层 `files:` 字段（原报错根因）。
      # APK/AAB/IPA 由默认 artifacts 规则（**/*.apk / **/*.aab / **/*.ipa）
      # 自动收集并在邮件里给出下载链接。

  android-release:
    name: Chengyu Clash — Android (release AAB)
    instance_type: linux
    max_build_duration: 60
    environment:
      node: latest
      # Add these as secured environment variables in the Codemagic UI
      # (groups → chengyuclash-release), base64-encode the keystore file into
      # $CM_KEYSTORE_FILE_B64 or upload it via Codemagic's file variables.
      groups:
        - chengyuclash-release
    scripts:
      - name: Install dependencies and sync web (release gate)
        script: |
          cd mobile
          npm ci
          npm run sync -- --release
          npx cap sync android
      - name: Decode keystore and build signed AAB
        script: |
          cd mobile
          echo "$CM_KEYSTORE_FILE_B64" | base64 --decode > android/app/release.keystore
          ./android/gradlew -p android bundleRelease \
            -Pandroid.injected.signing.store.file="$PWD/android/app/release.keystore" \
            -Pandroid.injected.signing.store.password="$CM_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$CM_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$CM_KEY_PASSWORD"
    publishing:
      email:
        recipients:
          - YOUR_EMAIL@example.com
      # （同上：不留 files 字段，产物自动收集）

  ios-build:
    name: Chengyu Clash — iOS
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      node: latest
      xcode: latest
      # Sign with automatic code signing (configure App Store Connect API key
      # in Codemagic UI: Teams → Codemagic API → connections) or manual certs.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.chengyuclash.app
    scripts:
      - name: Install dependencies, add iOS platform, sync web
        script: |
          cd mobile
          npm ci
          npm run sync -- --release
          npx cap add ios
          npx cap sync ios
      - name: Build and sign ipa
        script: |
          cd mobile
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App"
    publishing:
      email:
        recipients:
          - YOUR_EMAIL@example.com
      # TestFlight distribution once signing is configured:
      # app_store_connect:
      #   api_key: $APP_STORE_CONNECT_PRIVATE_KEY
      #   key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
      #   issuer_id: $APP_STORE_CONNECT_ISSUER_ID

  # 不需要任何 Apple 签名/账号：产出 iPhone 模拟器 .app 的 zip，
  # 直接上传 Appetize.io 即可在 Windows 浏览器里跑 iOS 模拟器。
  # 注意：模拟器包仅用于 Appetize 预检，不能安装到真机，也不能上 TestFlight。
  ios-simulator:
    name: Chengyu Clash — iOS (simulator for Appetize)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: latest
      xcode: latest
    scripts:
      - name: Install dependencies, add iOS platform, sync web
        script: |
          cd mobile
          npm ci
          npm run sync -- --release
          npx cap add ios
          npx cap sync ios
      - name: Build for iOS Simulator (unsigned)
        script: |
          cd mobile
          if [ -d "ios/App/App.xcworkspace" ]; then
            WORKSPACE_ARGS=(-workspace "ios/App/App.xcworkspace")
          else
            WORKSPACE_ARGS=(-project "ios/App/App.xcodeproj")
          fi
          xcodebuild "${WORKSPACE_ARGS[@]}" \
            -scheme "App" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "ios/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Zip the simulator .app for Appetize
        script: |
          cd mobile
          APP_PATH=$(find ios/build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -n 1)
          echo "Simulator app: $APP_PATH"
          # ditto keeps symlinks/metadata intact, which Appetize requires
          ditto -c -k --keepParent "$APP_PATH" "$CM_BUILD_DIR/chengyu-clash-ios-simulator.zip"
    publishing:
      email:
        recipients:
          - YOUR_EMAIL@example.com
    # artifacts 必须是工作流顶层字段（放 publishing 下会报 extra fields not permitted）
    artifacts:
      - chengyu-clash-ios-simulator.zip
